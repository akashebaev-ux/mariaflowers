<script>
    // Enable/disable +/- buttons for a specific quantity input group
    function handleEnableDisable(inputGroup) {
        var qtyInput = $(inputGroup).find('.qty_input');
        var currentValue = parseInt(qtyInput.val());

        var minusDisabled = currentValue < 2;
        var plusDisabled = currentValue > 98;

        $(inputGroup)
            .find('.decrement-qty')
            .prop('disabled', minusDisabled);

        $(inputGroup)
            .find('.increment-qty')
            .prop('disabled', plusDisabled);
    }

    // Set correct button state on page load
    $('.qty_input').each(function() {
        var inputGroup = $(this).closest('.input-group');
        handleEnableDisable(inputGroup);
    });

    // Check enable/disable when quantity is typed manually
    $('.qty_input').change(function() {
        var inputGroup = $(this).closest('.input-group');
        handleEnableDisable(inputGroup);
    });

    // Increment quantity
    $('.increment-qty').click(function(e) {
        e.preventDefault();

        var inputGroup = $(this).closest('.input-group');
        var closestInput = inputGroup.find('.qty_input');
        var currentValue = parseInt(closestInput.val());

        closestInput.val(currentValue + 1);

        handleEnableDisable(inputGroup);
    });

    // Decrement quantity
    $('.decrement-qty').click(function(e) {
        e.preventDefault();

        var inputGroup = $(this).closest('.input-group');
        var closestInput = inputGroup.find('.qty_input');
        var currentValue = parseInt(closestInput.val());

        closestInput.val(currentValue - 1);

        handleEnableDisable(inputGroup);
    });
</script>
